AWSTemplateFormatVersion: "2010-09-09"
Description: IAM Role for STS Assume Role Example
Parameters:
  BucketName:
    Type: String
    Description: Name of the S3 Bucket
    Default: my-ajju-sts-assume-bucket
Resources:
  S3Bucket:
    Type: 'AWS::S3::Bucket'
    Properties:
      BucketName: !Ref BucketName
  STSRoles:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: arn:aws:iam::635465244923:user/no-permission-user
            Action:
              - 'sts:AssumeRole'
      Path: /
      Policies:
        - PolicyName: s3access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: '*'
                Resource: [
                  !Sub "arn:aws:s3:::${BucketName}/*",
                  !Sub "arn:aws:s3:::${BucketName}"
                ]